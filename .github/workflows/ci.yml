name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
      - master

jobs:
  project-sanity:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run project sanity checks
        run: script/ci_sanity.sh

  xcode-build:
    runs-on: macos-latest
    needs: project-sanity
    env:
      # The runner is Apple silicon: build and test arm64 only, simulator rather than device.
      CARRIER_CORE_APPLE_TARGETS: aarch64-apple-darwin aarch64-apple-ios-sim

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Rust targets for the protocol core
        run: rustup target add $CARRIER_CORE_APPLE_TARGETS

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Core/carrier-core

      - name: Build the Rust protocol core
        # The stamp tells Xcode's pre-build step the core is current, so it does not rebuild every target.
        run: script/build_carrier_core_apple.sh && touch Core/build/.stamp

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check Xcode compatibility
        id: xcode
        run: |
          xcodebuild -version
          version="$(xcodebuild -version | awk '/Xcode/ { print $2 }')"
          major="${version%%.*}"
          if [ "${major:-0}" -ge 26 ]; then
            echo "supports_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "supports_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Xcode builds because this runner has Xcode $version. TypeCarrier currently targets iOS 26.0 and macOS 26.0."
          fi

      - name: Test core package
        if: steps.xcode.outputs.supports_build == 'true'
        run: |
          xcodebuild \
            -project TypeCarrier.xcodeproj \
            -scheme TypeCarrierCore \
            -destination 'platform=macOS' \
            ARCHS=arm64 \
            test

      - name: Build macOS app
        if: steps.xcode.outputs.supports_build == 'true'
        run: |
          xcodebuild \
            -project TypeCarrier.xcodeproj \
            -scheme TypeCarrierMac \
            -destination 'platform=macOS' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS app
        if: steps.xcode.outputs.supports_build == 'true'
        run: |
          xcodebuild \
            -project TypeCarrier.xcodeproj \
            -scheme TypeCarrieriOS \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

  android-debug-build:
    runs-on: ubuntu-latest
    env:
      # One ABI is enough to prove the core and app build; releases build all of them.
      ANDROID_ABIS: arm64-v8a

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Core/carrier-core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Test and build Android debug app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        working-directory: Apps/Android
        run: ./gradlew testDebugUnitTest assembleDebug
