name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
      - master

jobs:
  project-sanity:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run project sanity checks
        run: script/ci_sanity.sh

  xcode-build:
    runs-on: macos-latest
    needs: project-sanity

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Rust targets for the protocol core
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check Xcode compatibility
        id: xcode
        run: |
          xcodebuild -version
          version="$(xcodebuild -version | awk '/Xcode/ { print $2 }')"
          major="${version%%.*}"
          if [ "${major:-0}" -ge 26 ]; then
            echo "supports_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "supports_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Xcode builds because this runner has Xcode $version. TypeCarrier currently targets iOS 26.0 and macOS 26.0."
          fi

      - name: Test core package
        if: steps.xcode.outputs.supports_build == 'true'
        run: |
          xcodebuild \
            -project TypeCarrier.xcodeproj \
            -scheme TypeCarrierCore \
            -destination 'platform=macOS' \
            test

      - name: Build macOS app
        if: steps.xcode.outputs.supports_build == 'true'
        run: |
          xcodebuild \
            -project TypeCarrier.xcodeproj \
            -scheme TypeCarrierMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS app
        if: steps.xcode.outputs.supports_build == 'true'
        run: |
          xcodebuild \
            -project TypeCarrier.xcodeproj \
            -scheme TypeCarrieriOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  android-debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Rust Android targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Test and build Android debug app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        working-directory: Apps/Android
        run: ./gradlew testDebugUnitTest assembleDebug
